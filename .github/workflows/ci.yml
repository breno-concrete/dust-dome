name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the old run, so the queue never piles up.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Mark "check" and "ownership" as required in the branch ruleset.
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Format (prettier)
        run: npm run format:check

      - name: Lint (oxlint)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (engine, scene visuals, game-design rules for the config files)
        run: npm test

      - name: Build
        run: npm run build

  ownership:
    # Fails if a PR edits files outside the area of its branch prefix (see CLAUDE.md).
    name: ownership
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check changed paths against the branch area
        run: >
          node .github/scripts/check-ownership.mjs
          "${{ github.head_ref }}"
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
